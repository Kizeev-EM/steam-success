[tool.poetry]
name = "steam-success"
version = "0.2.0"
description = "Прогноз коммерческого успеха игры Steam по карточке на момент релиза"
authors = ["Кизеев Е.М."]
readme = "README.md"
packages = [{ include = "steam_success", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pandas = "3.1.0"
numpy = "^2.4"
scipy = "^1.17"
scikit-learn = "1.9.1"
pandera = "0.34.1"
statsmodels = "0.15.0"
matplotlib = "^3.11"
pyarrow = "*"
pyyaml = "^6.0"
joblib = "^1.5"
dvc = "3.67.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
